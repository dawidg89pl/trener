<!doctype html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<body>
  <style th:fragment="footer-styles">
    .app-footer{min-height:64px;padding:20px max(28px,calc((100vw - 1240px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px}
    .app-footer p{margin:0}.app-version{font-variant-numeric:tabular-nums}
    .auth-page .auth-layout{min-height:calc(100vh - 64px)}.auth-page .app-footer{background:#102e3b;border-top-color:#274754;color:#c3d2d5}
    @media(max-width:530px){.app-footer{padding:18px 20px;flex-direction:column;justify-content:center}}
  </style>
  <footer class="app-footer" th:fragment="footer">
    <style th:replace="~{fragments/footer :: footer-styles}"></style>
    <p>&copy; 2026 by Dawid Górokwy</p>
    <p class="app-version">Trener AI <span th:text="|v${appVersion}|">vdev</span></p>
    <script src="/js/scroll-restoration.js"></script>
  </footer>
</body>
</html>
