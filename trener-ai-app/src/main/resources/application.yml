spring:
  application:
    name: trener-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trener_ai}
    username: ${DB_USER:trener}
    password: ${DB_PASSWORD:trener_secret_change_me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  thymeleaf:
    cache: false
server:
  #port: ${PORT:8080}
  port: ${PORT:20190}
app:
  public-url: ${APP_PUBLIC_URL:https://trenerai.mikrus.dev}
  crypto-key: ${APP_CRYPTO_KEY:change-this-to-a-long-random-secret-at-least-32-characters}
  strava:
    client-id: ${STRAVA_CLIENT_ID:}
    client-secret: ${STRAVA_CLIENT_SECRET:}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  packages-to-scan: pl.trenerai.api