<div class="activity-item" xmlns:th="http://www.thymeleaf.org" th:fragment="item(item)">
  <div class="activity-row">
    <input type="checkbox" name="activityIds" th:id="|activity-${item.id}|" th:value="${item.id}" th:checked="${!item.analyzed}">
    <label class="custom-check" th:for="|activity-${item.id}|" aria-label="Wybierz aktywność"></label>
    <label class="activity-title" th:for="|activity-${item.id}|"><strong th:text="${item.name}">Jazda</strong><small th:text="|${item.activityDate} · ${item.activityType}|">Data · typ</small></label>
    <span class="metric"><strong th:text="${#numbers.formatDecimal(item.distanceKm, 1, 2)}">0,00</strong><small>km</small></span>
    <span class="metric"><strong th:text="${item.movingTimeMin}">0</strong><small>min</small></span>
    <span class="metric elevation"><strong th:text="|+${item.elevationGainM}|">+0</strong><small>m</small></span>
    <span class="status" th:classappend="${item.analyzed ? ' status-muted' : ' status-new'}" th:text="${item.analyzed ? 'analizowany' : 'nowy'}">nowy</span>
  </div>
  <details class="activity-details">
    <summary><span>Szczegóły pomiarów</span><span class="activity-details-chevron" aria-hidden="true"></span></summary>
    <div class="activity-detail-grid">
      <div><span>Śr. moc</span><strong th:text="${item.averageWatts != null ? #numbers.formatDecimal(item.averageWatts, 1, 0) + ' W' : 'Brak danych'}">Brak danych</strong></div>
      <div><span>Moc ważona</span><strong th:text="${item.weightedAverageWatts != null ? #numbers.formatDecimal(item.weightedAverageWatts, 1, 0) + ' W' : 'Brak danych'}">Brak danych</strong></div>
      <div><span>Śr. tętno</span><strong th:text="${item.averageHeartRate != null ? #numbers.formatDecimal(item.averageHeartRate, 1, 0) + ' bpm' : 'Brak danych'}">Brak danych</strong></div>
      <div><span>Maks. tętno</span><strong th:text="${item.maxHeartRate != null ? #numbers.formatDecimal(item.maxHeartRate, 1, 0) + ' bpm' : 'Brak danych'}">Brak danych</strong></div>
      <div><span>Śr. kadencja</span><strong th:text="${item.averageCadence != null ? #numbers.formatDecimal(item.averageCadence, 1, 0) + ' rpm' : 'Brak danych'}">Brak danych</strong></div>
      <div><span>Śr. prędkość</span><strong th:text="${item.averageSpeedKph != null ? #numbers.formatDecimal(item.averageSpeedKph, 1, 1) + ' km/h' : 'Brak danych'}">Brak danych</strong></div>
    </div>
  </details>
</div>
