name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trener-ai-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: trener-ai-app/pom.xml

      - name: Run tests
        run: mvn -B verify

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Mikrus
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.MIKRUS_HOST }}
          username: ${{ secrets.MIKRUS_USER }}
          key: ${{ secrets.MIKRUS_SSH_KEY }}
          port: ${{ secrets.MIKRUS_SSH_PORT }}
          script: |
            if [ ! -d ~/trener ]; then
              git clone https://github.com/dawidg89pl/trener.git ~/trener
            fi
            cd ~/trener
            git pull origin main
            docker compose up -d --build --remove-orphans
            docker image prune -f
